<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MacOs</title>
  
  <link rel="stylesheet" href="style.css">
  <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
</head>
<body>
  <main>
    <div class="taskbar">


      <div class="taskbar-left">
         <span class="menu-trigger" data-menu="Apple">
           <i class="ri-apple-fill"></i>
         </span>
        <span class="menu-trigger active-app" data-menu="Finder">Finder</span>
        <span class="menu-trigger" data-menu="File">File</span>
        <span class="menu-trigger" data-menu="Edit">Edit</span>
        <span class="menu-trigger" data-menu="View">View</span>
        <span class="menu-trigger" data-menu="Go">Go</span>
        <span class="menu-trigger" data-menu="Window">Window</span>
        <span class="menu-trigger" data-menu="Help">Help</span>
    </div>

        <div class="taskbar-right">
      <span class="bluetooth"><i class="ri-bluetooth-line"></i></span>
      <span class="wifi"><i class="ri-wifi-line"></i></span>
      <span class="battery">80%</span>
      <span class="date-time"></span>
        </div>


    </div>

    <div class="menu-dropdown"></div>
    <div class="main-screen">

    </div>
    <div class="apps-footer">

  <span class="dock-app finder">
    <img src="./assests/finder png_1024x1024x32.png" alt="Finder">
  </span>

  <span class="dock-app vscode">
    <img src="./assests/vscode_1024x1024x32.png" alt="VS code">
  </span>



  <span class="dock-app whatsapp">
    <img src="./assests/whatsapp_1024x1024x32.png" alt="WhatsApp">
  </span>

  <span class="dock-app brave">
    <img src="./assests/brave_512x512x32.png" alt="Brave">
  </span>



  <span class="dock-app settings">
    <img src="./assests/settings.png" alt="Settings">
  </span>





    </div>
  </main>
  <script src="script.js"></script>
  
</body>
</html>
