<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard">

        <h1>CAR SIMULATOR 🚗</h1>

        <p class="subtitle">
            Create your own car and control its speed.
        </p>

        <!-- Car Form -->

        <div class="form">

            <!-- <select id="brand">

                <option value="">Choose Brand</option>

                <option>BMW</option>
                <option>Audi</option>
                <option>Mercedes</option>
                <option>Porsche</option>
                <option>Ferrari</option>
                <option>Lamborghini</option>
                <option>Bugatti</option>
                <option>McLaren</option>
                <option>Tesla</option>
                <option>Tata</option>
                <option>Mahindra</option>

            </select> -->

        </div>

        <!-- Car Name -->

        <h2 id="carName">        </h2>

        <!-- Dashboard -->

        <div class="stats">

            <div class="card">

                <h3>Speed</h3>

                <p id="speed">
                    0 km/h
                </p>

            </div>

            <div class="card">

                <h3>Fuel</h3>

                <p id="fuel">
                    100%
                </p>

            </div>

        </div>

        <!-- Buttons -->

        <div class="buttons">

            <button id="boost">
                BOOST 🚀
            </button>

            <button id="brake">
                BRAKE 🛑
            </button>

            <button id="refuel">
                REFUEL ⛽
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
